substitutions:
  # Legacy BLE devices keep updating from the firmware-ble manifest.
  ota_stable_manifest: "https://apolloautomation.github.io/MTR-1/firmware-ble/manifest.json"
  ota_beta_manifest: "https://github.com/ApolloAutomation/MTR-1/releases/download/beta-fw/manifest-ble.json"

esphome:
  name: "${name}"
  friendly_name: Apollo MTR-1
  comment: Apollo MTR-1
  name_add_mac_suffix: true

  project:
    name: "ApolloAutomation.MTR-1"
    version: "${version}"

  min_version: 2025.11.0
  on_boot:
  - priority: 500
    then:
      - text_sensor.template.publish:
          id: apollo_firmware_version
          state: "${version}"
  - priority: -10
    then:
      - if:
          condition:
            - lambda: "return id(runTest);"
          then:
            - lambda: "id(testScript).execute();"

logger:

dashboard_import:
  package_import_url: github://ApolloAutomation/MTR-1/Integrations/ESPHome/MTR-1_BLE.yaml
  import_full_config: false

ota:
  - platform: esphome
    id: ota_esphome
  - platform: http_request
    id: ota_managed

safe_mode:

update:
  - platform: http_request
    id: update_http_request
    name: Firmware Update
    source: https://apolloautomation.github.io/MTR-1/firmware-ble/manifest.json

wifi:
  on_connect:
    - component.update: update_http_request
  ap:
    ssid: "Apollo MTR1 Hotspot"

packages:
  core: !include Core.yaml
