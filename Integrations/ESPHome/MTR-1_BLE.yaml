esphome:
  name: "${name}"
  friendly_name: Apollo MTR-1
  comment: Apollo MTR-1
  name_add_mac_suffix: true

  project:
    name: "ApolloAutomation.MTR-1"
    version: "${version}"

  min_version: 2025.8.0
  on_boot:
    priority: 600
    then:
      - script.execute: statusCheck
      - if:
          condition:
            - lambda: "return id(runTest);"
          then:
            - lambda: "id(testScript).execute();"

logger:

dashboard_import:
  package_import_url: github://ApolloAutomation/MTR-1/Integrations/ESPHome/MTR-1_BLE.yaml
  import_full_config: false

ota:
  - platform: esphome
    id: ota_esphome

wifi:
  ap:
    ssid: "Apollo MTR1 Hotspot"

bluetooth_proxy:
  active: true
esp32_ble_tracker:
  scan_parameters:
    active: false

packages:
  core: !include Core.yaml
